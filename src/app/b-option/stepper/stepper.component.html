<mat-stepper
  orientation="vertical"
  #stepper
  class="mortgage-stepper py-4 bg-transparent"
  (selectionChange)="onStepChange($event)"
>
  <ng-template matStepperIcon="edit">
    <mat-icon>check</mat-icon>
  </ng-template>

  <!-- Stap 1 -->
  <mat-step class="p-4">
    <ng-template matStepLabel><p class="m-0">Persoonlijk</p></ng-template>
  </mat-step>

  <!-- Stap 2 -->
  <mat-step>
    <ng-template matStepLabel><p class="m-0">Inkomen</p></ng-template>
  </mat-step>

  <!-- Stap 3 -->
  <mat-step>
    <ng-template matStepLabel><p class="m-0">Wonen</p></ng-template>
  </mat-step>

  <!-- Stap 4 -->
  <mat-step>
    <ng-template matStepLabel><p class="m-0">Resultaat</p></ng-template>
  </mat-step>
</mat-stepper>
