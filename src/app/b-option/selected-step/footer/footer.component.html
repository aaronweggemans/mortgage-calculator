<!-- Navigatie -->
<div class="d-flex flex-column gap-4">
  @if (!hidePrevious() || !hideNext()) {
    <div class="d-flex flex-column flex-md-row gap-4">
      @if (!hidePrevious()) {
        <button
          class="btn p-3 btn-light"
          type="button"
          [disabled]="previousDisabled()"
          (click)="previous.emit()"
        >
          Vorige
        </button>
      }

      @if (!hideNext()) {
        <button
          class="btn p-3 awwp-bg-primary ms-md-auto"
          type="button"
          [disabled]="nextDisabled()"
          (click)="next.emit()"
        >
          Volgende
        </button>
      }
    </div>
  }

  <hr class="m-0" />

  <div class="d-flex flex-row gap-2">
    <mat-icon class="awwp-text-primary flex-shrink-0">info</mat-icon>
    <p class="m-0 text-secondary">
      Uw gegevens worden alleen gebruikt voor deze berekening en niet opgeslagen in een database.
    </p>
  </div>
</div>
