<div class="d-flex flex-column flex-item gap-3">
  <div class="d-flex flex-item flex-column gap-3">
    <div class="alert alert-warning m-0 p-4">
      <p class="m-0 fs-1">{{ maxMortgage() | currency: 'EUR' : 'symbol' : '1.0-0' }},-</p>
      <p class="m-0 text-secondary">Indicatie maximale hypotheek</p>
    </div>
  </div>

  <div class="bg-light border-none rounded p-4">
    <div class="d-flex flex-item flex-column gap-3">
      <p class="fs-4 awwp-text-primary m-0">Berekening gebasseerd op:</p>
      <div class="d-flex flex-wrap gap-3">
        <app-card
          class="flex-fill"
          icon="person_outline"
          title="Uw bruto jaarinkomen"
          [subtitle]="(income() | currency: 'EUR' : 'symbol' : '1.0-0')! + ',-'"
        />
        <app-card
          class="flex-fill"
          icon="people_outline"
          title="Jaarinkomen partner"
          [subtitle]="
            partnerIncome() === 0
              ? 'n.v.t.'
              : (partnerIncome() | currency: 'EUR' : 'symbol' : '1.0-0')! + ',-'
          "
        />
        <app-card
          class="flex-fill"
          icon="euro_symbol"
          title="Totaal bruto jaarinkomen"
          [subtitle]="(totalIncome() | currency: 'EUR' : 'symbol' : '1.0-0')! + ',-'"
        />
      </div>

      <div class="d-flex flex-wrap gap-3">
        <app-card
          class="flex-fill"
          icon="calendar_today"
          title="Berekende maandlast"
          [subtitle]="(monthlyCosts() | currency: 'EUR' : 'symbol' : '1.0-0')! + ',-'"
        />
        <app-card
          class="flex-fill"
          icon="account_balance"
          title="Benodigde eigengeld"
          [subtitle]="(ownContribution() | currency: 'EUR' : 'symbol' : '1.0-0')! + ',-'"
        />
        <!-- if relevant -->
        <app-card
          class="flex-fill"
          icon="calendar_today"
          title="Overdrachtsbelasting"
          [subtitle]="
            shouldPayTransferTax()
              ? (transferTax() | currency: 'EUR' : 'symbol' : '1.0-0')! + ',-'
              : 'n.v.t.'
          "
        />
        <!-- else eigengeld? -->
      </div>
      <div class="d-flex gap-2">
        <button
          #calculateAgainButton
          class="btn btn-light py-2 border flex-fill"
          type="button"
          (click)="resetFlow.emit()"
        >
          Opnieuw berekening maken
        </button>
        <a class="btn btn-light py-2 border flex-fill" href="/contact"
          >Persoonlijk advies aanvragen</a
        >
      </div>
    </div>
  </div>
</div>
