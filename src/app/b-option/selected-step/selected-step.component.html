<div class="d-flex flex-column gap-4">
  <app-header [title]="header().title" [subtitle]="header().description" [step]="step() + 1" />

  <div class="d-flex flex-column gap-md-4 gap-3">
    @switch (step()) {
      @case (0) {
        <app-stap-1
          class="d-contents"
          [(data)]="personal"
          (nextButtonValidity)="isFormInvalid.set($event)"
        />
      }

      @case (1) {
        <app-stap-2
          class="d-contents"
          [(data)]="incomeAndPartner"
          (nextButtonValidity)="isFormInvalid.set($event)"
        />
      }

      @case (2) {
        <app-stap-3
          class="d-contents"
          [(data)]="living"
          (nextButtonValidity)="isFormInvalid.set($event)"
        />
      }

      @case (3) {
        <app-stap-4 class="d-contents" (resetFlow)="resetFlow.emit()" />
      }
    }
  </div>

  <app-footer (previous)="previous.emit()" (next)="next.emit()" [nextDisabled]="isFormInvalid()" />
</div>
