<div class="bg-transparent d-flex flex-column flex-md-row gap-md-2">
  <app-stepper class="align-self-stretch bg-light" (stepChanged)="selectedStep.set($event)" />
  <app-selected-step
    class="flex-grow-1 p-4 my-3 min-w-0"
    [step]="selectedStep()"
    (next)="stepper().next()"
    (previous)="stepper().previous()"
    (resetFlow)="stepper().reset()"
  />
</div>
